services:
  desk-qdrant:
    image: qdrant/qdrant:latest
    container_name: desk-qdrant
    restart: unless-stopped
    volumes:
      - desk-qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - crove_postiz-network

  desk-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: crove/crove-desk:latest
    container_name: desk-server
    restart: unless-stopped
    depends_on:
      desk-qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - desk-app-data:/app/data
      - ./docker/agent-desk.supabase.yaml:/app/config/config.yaml:ro
    environment:
      TZ: Asia/Ho_Chi_Minh
    networks:
      - crove_postiz-network

volumes:
  desk-qdrant-data:
    name: crove-desk-qdrant-data
  desk-app-data:
    name: crove-desk-app-data

networks:
  crove_postiz-network:
    external: true
