language: en-US

server:
  port: 8083
  cors:
    allowedOrigins:
      - https://desk.crove.com
      - https://crm.crove.com
      - http://127.0.0.1:8083
      - http://localhost:8083

db:
  type: postgres
  # Supabase Session Pooler (port 5432) with schema desk
  dsn: "host=aws-1-ap-southeast-1.pooler.supabase.com user=postgres.gulptwduchsjcsbndmua password=<PASSWORD> dbname=postgres port=5432 sslmode=require search_path=desk"
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxIdleTimeSeconds: 300
  connMaxLifetimeSeconds: 1800

logger:
  level: info
  format: text
  addSource: false

auth:
  tokenTTLHours: 12
  maxFailedAttempts: 5
  credentialLockMinute: 15

customerSession:
  secret: replace-with-a-random-secret-at-least-32-chars
  ttlMinutes: 120
  refreshThresholdMinutes: 30

storage:
  default: local
  maxUploadSizeMB: 20
  local:
    root: /app/data/storage
    baseUrl: /storage
  oss:
    endpoint: ""
    bucket: ""
    accessKeyId: ""
    accessKeySecret: ""
    baseUrl: ""
    private: false
    signedUrlExpireSeconds: 600

vectorDB:
  type: qdrant
  qdrant:
    host: desk-qdrant
    grpcPort: 6334
    apiKey: ""
    useTls: false

mcp:
  enabled: true
  servers:
    system:
      enabled: true
      endpoint: "http://127.0.0.1:8083/api/mcp"
      timeoutMs: 15000
      headers: {}

oidc:
  enabled: true
  issuer: "https://gulptwduchsjcsbndmua.supabase.co/auth/v1"
  clientId: "18790ccb-4d71-48cd-ad24-aee5f3ced3da"
  clientSecret: "<OIDC_CLIENT_SECRET>"
  redirectUrl: "https://desk.crove.com/api/auth/oidc_callback"
  stateSecret: "crove-desk-oidc-state-secret-4f81c9e2b7a0"
  scopes:
    - openid
    - profile
    - email
