services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  agent-desk:
    build:
      context: .
      dockerfile: Dockerfile
    image: crove-desk:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-desk-data:/app/data
      - ./docker/agent-desk.yaml:/app/config/config.yaml:ro
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      QDRANT_HOST: qdrant
      DB_TYPE: postgres
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable&search_path=desk"

volumes:
  qdrant-data:
  agent-desk-data:
