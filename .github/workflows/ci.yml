name: CI

on:
  # deploy-beta.yml builds and publishes an image on every push to dev, so CI has
  # to run on push too. Without this a direct push shipped a beta image that no
  # test had ever seen, because pull_request was the only trigger.
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run Go Vet
        run: |
          go vet -tags dev ./...

      - name: Run Go Tests
        run: |
          go test -v -tags dev ./internal/services/... ./internal/repositories/... ./internal/pkg/... ./internal/oidcclient/... ./internal/migration/... ./internal/builders/... ./internal/bootstrap/... ./internal/handlers/...

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd web && pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: |
          cd web && pnpm typecheck

      - name: Run Node Tests
        run: |
          cd web && node --test "**/*.test.mjs"

      # Reported but not enforced: the tree currently carries six pre-existing
      # react-hooks errors (tracked as PROC-16). Making this blocking before they
      # are fixed would turn every unrelated PR red.
      - name: Run Lint
        continue-on-error: true
        run: |
          cd web && pnpm lint
